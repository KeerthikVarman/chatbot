<!DOCTYPE html>
<html>
<head>
<style>

.login-box{
    width:300px;
    border:2px solid black;
    padding:20px;
    margin:50px auto;
}
</style>
</head>

<body>
    <form action="/login_accesss" method="POST">
        <div class="login-box">

            <h2>Login</h2>
            <input type="text" name="nm" placeholder="Username" required><br><br>

            <input type="password" name="pass" placeholder="Password" required><br><br>

            <p><label><h1>Captcha:{{captch}}</h1></label></p>
            {% if error %}
            <p style="color:red;">{{error}}</p>
            {% endif %}
            <input type="text" name="cap" placeholder="Enter the Captcha" required>

            <p><input type="submit" value="submit"/></p>

        </div>
    </form>
</body>
</html>
